name: Refresh article CSS cache for desktop sidebar glow
on:
  push:
    branches:
      - hotfix/desktop-hero-sidebar-glow-20261112
    paths:
      - scripts/refresh-article-glow-cache.mjs
      - .github/workflows/refresh-article-glow-cache.yml

permissions:
  contents: write

jobs:
  refresh-article-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Refresh CSS query in article HTML
        run: |
          node --check scripts/refresh-article-glow-cache.mjs
          node scripts/refresh-article-glow-cache.mjs
          node scripts/test-site-meta.mjs
          node scripts/verify-approved-research-release.mjs
      - name: Check scope and whitespace
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(dist/research/[^/]+/index\.html|$)' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected changes: %s\n' "$unexpected"
            exit 1
          fi
          count="$(printf '%s\n' "$changed" | grep -c '^dist/research/[^/][^/]*/index\.html$')"
          if [ "$count" -ne 166 ]; then
            printf 'Expected 166 changed articles, found %s\n' "$count"
            exit 1
          fi
      - name: Commit validated changes on hotfix branch
        run: |
          git config user.name "lowob style cache"
          git config user.email "actions@users.noreply.github.com"
          git add dist/research/
          git diff --cached --check
          git commit -m "Refresh article CSS URLs for desktop sidebar glow"
          git push origin HEAD:hotfix/desktop-hero-sidebar-glow-20261112
