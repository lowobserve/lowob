name: Refresh article CSS and JS for independently scrolling sidebar
on:
  push:
    branches: [hotfix/sidebar-scroll-with-unclipped-glow-20261112]
    paths:
      - scripts/refresh-sidebar-scroll-assets.mjs
      - .github/workflows/refresh-sidebar-scroll-assets.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update assets and validate site
        run: |
          node --check dist/assets/research-interactions.js
          node --check scripts/refresh-sidebar-scroll-assets.mjs
          node scripts/refresh-sidebar-scroll-assets.mjs
          node scripts/test-site-meta.mjs
          node scripts/verify-approved-research-release.mjs
      - name: Verify article-only migration
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(dist/research/[^/]+/index\.html|$)' || true)"
          if [ -n "$unexpected" ]; then printf 'Unexpected files: %s\n' "$unexpected"; exit 1; fi
          count="$(printf '%s\n' "$changed" | grep -Ec '^dist/research/[^/]+/index\.html$')"
          test "$count" -eq 166
      - name: Commit refreshed asset refs
        run: |
          git config user.name "lowob site maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add dist/research/
          git diff --cached --check
          git commit -m "Refresh Research article assets for scrollable sidebar"
          git push origin HEAD:hotfix/sidebar-scroll-with-unclipped-glow-20261112
