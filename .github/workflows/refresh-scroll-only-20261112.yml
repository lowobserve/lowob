name: Refresh Research article scroll-only scrollbar styles
on:
  push:
    branches: [hotfix/sidebar-visible-only-while-scrolling-20261112]
    paths:
      - scripts/refresh-scroll-only-20261112.mjs
      - .github/workflows/refresh-scroll-only-20261112.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh 166 article stylesheet and script links
        run: |
          node --check dist/assets/research-interactions.js
          node --check scripts/refresh-scroll-only-20261112.mjs
          node scripts/refresh-scroll-only-20261112.mjs
          node scripts/test-site-meta.mjs
          node scripts/verify-approved-research-release.mjs
      - name: Verify only article HTML changed
        run: |
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^dist/research/[^/]+/index\.html$' || true)"
          test -z "$unexpected" || { printf '%s\n' "$unexpected"; exit 1; }
          count="$(git diff --name-only | grep -Ec '^dist/research/[^/]+/index\.html$')"
          test "$count" -eq 166
      - name: Commit refreshed article assets
        run: |
          git config user.name "lowob site maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add dist/research/
          git diff --cached --check
          git commit -m "Refresh article scrollbar styles for scrolling-only visibility"
          git push origin HEAD:hotfix/sidebar-visible-only-while-scrolling-20261112
