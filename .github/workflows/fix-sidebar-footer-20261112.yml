name: Restore visible article scrollbar and remove footer tagline
on:
  push:
    branches: [hotfix/article-scrollbar-footer-cleanup-20261112]
    paths:
      - scripts/fix-sidebar-footer-20261112.mjs
      - .github/workflows/fix-sidebar-footer-20261112.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply HTML fixes and validate
        run: |
          node --check scripts/fix-sidebar-footer-20261112.mjs
          node scripts/fix-sidebar-footer-20261112.mjs
          node scripts/test-site-meta.mjs
          node scripts/verify-approved-research-release.mjs
      - name: Verify scope and format
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(dist/(.*\/)?index\.html|$)' || true)"
          if [ -n "$unexpected" ]; then printf 'Unexpected files: %s\n' "$unexpected"; exit 1; fi
          count="$(printf '%s\n' "$changed" | grep -Ec '^dist/(.*\/)?index\.html$')"
          test "$count" -eq 177
      - name: Commit HTML-only updates
        run: |
          git config user.name "lowob site maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add dist/
          git diff --cached --check
          git commit -m "Restore article sidebar scrollports and remove footer tagline"
          git push origin HEAD:hotfix/article-scrollbar-footer-cleanup-20261112
