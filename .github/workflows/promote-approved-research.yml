name: Promote approved lowob Research

on:
  push:
    branches:
      - release/research-editorial-20261110
    paths:
      - research-release-source/**
      - scripts/build-approved-research-release.mjs
      - scripts/verify-approved-research-release.mjs
      - .github/workflows/promote-approved-research.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify script syntax
        run: |
          node --check scripts/build-approved-research-release.mjs
          node --check scripts/verify-approved-research-release.mjs

      - name: Verify metadata regression tests
        run: node scripts/test-site-meta.mjs

      - name: Promote exact approved preview to public research URLs
        run: node scripts/build-approved-research-release.mjs

      - name: Validate every article and SEO index
        run: node scripts/verify-approved-research-release.mjs

      - name: Check generated diff
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(dist/research/|dist/sitemap.xml$|dist/llms.txt$|$)' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected production modifications:\n%s\n' "$unexpected"
            exit 1
          fi
          git add dist/research dist/assets/research-design.css dist/assets/research-interactions.js dist/sitemap.xml dist/llms.txt
          git diff --cached --check

      - name: Save validated release artifacts without deploying production
        run: |
          if ! git diff --cached --quiet; then
            git config user.name "lowob research release"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Build production-ready research: 31 editorial, 135 visual, 166 preserved URLs"
            git push origin HEAD:release/research-editorial-20261110
          fi
