name: Verify visual lab preview

on:
  push:
    branches: [codex/visual-lab]

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PREVIEW_URL: https://codex-visual-lab-lowob.chris-211.workers.dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for this commit at the public preview
        shell: bash
        run: |
          for attempt in {1..36}; do
            if curl -fsS --max-time 10 -D home.headers -o home.html "$PREVIEW_URL/" &&
               curl -fsS --max-time 10 -D system.headers -o system.html "$PREVIEW_URL/system/" &&
               grep -Fq 'data-edition="signal-in-motion"' home.html &&
               grep -Fq 'vl-system-score' system.html &&
               curl -fsS --max-time 10 -o preview.js "$PREVIEW_URL/assets/visual-lab.js?v=3" &&
               cmp -s preview.js dist/assets/visual-lab.js &&
               cmp -s home.html dist/index.html &&
               grep -Eiq '^x-robots-tag:.*noindex' home.headers &&
               grep -Eiq '^x-robots-tag:.*noindex' system.headers; then
              echo "Verified $PREVIEW_URL"
              exit 0
            fi
            sleep 8
          done
          echo "::error::The public preview or its noindex headers could not be verified."
          exit 1

      - name: Test interactions in Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install --with-deps chromium
          node scripts/verify-visual-lab-browser.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-lab-screenshots
          path: visual-lab-screenshots/
          if-no-files-found: ignore

      - name: Publish verified preview status
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: |
          state=failure
          description='Preview or browser checks failed'
          if [ "$RESULT" = success ]; then
            state=success
            description='Public preview, noindex and browser checks passed'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f "state=$state" -f 'context=Visual lab preview' \
            -f "description=$description" -f "target_url=$PREVIEW_URL"
