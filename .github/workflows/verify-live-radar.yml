name: Verify live radar stylesheet delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-live-radar.yml']
  workflow_dispatch:
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare deployed homepage and radar CSS to this commit
        shell: bash
        run: |
          set -u
          for host in lowob.com www.lowob.com lowob.chris-211.workers.dev; do
            echo "::group::Inspect $host"
            html_file=$(mktemp)
            css_file=$(mktemp)
            if curl --fail --silent --show-error --location --retry 2 --max-time 20 -H 'Cache-Control: no-cache' "https://$host/?radar-check=20261123" -o "$html_file"; then
              if cmp -s "$html_file" dist/index.html; then echo "HOME_EQUALS_REPO=yes"; else echo "HOME_EQUALS_REPO=no"; fi
              grep -oE 'visual-lab-features\.css\?v=[^"]+' "$html_file" | head -1 || true
              grep -oE 'visual-components-20261123\.css\?v=[^"]+' "$html_file" | head -1 || true
            else
              echo "HOME_FETCH_FAILED"
            fi
            if curl --fail --silent --show-error --location --retry 2 --max-time 20 -H 'Cache-Control: no-cache' "https://$host/assets/visual-lab-features.css?v=white-dot-green-outline-20261123" -o "$css_file"; then
              if cmp -s "$css_file" dist/assets/visual-lab-features.css; then echo "RADAR_CSS_EQUALS_REPO=yes"; else echo "RADAR_CSS_EQUALS_REPO=no"; fi
              if grep -q 'border:1px solid var(--lab-green)' "$css_file"; then echo "GREEN_HIGHLIGHT_RULE_PRESENT=yes"; else echo "GREEN_HIGHLIGHT_RULE_PRESENT=no"; fi
              if grep -q 'height:.48rem;border-radius:50%;background:#fff' "$css_file"; then echo "WHITE_DOT_RULE_PRESENT=yes"; else echo "WHITE_DOT_RULE_PRESENT=no"; fi
            else
              echo "RADAR_CSS_FETCH_FAILED"
            fi
            rm -f "$html_file" "$css_file"
            echo "::endgroup::"
          done

      - name: Inspect actual marker colors in Chromium
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install chromium
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          try {
            await page.goto('https://lowob.com/?radar-render-check=20261123',{waitUntil:'domcontentloaded',timeout:30000});
            await page.evaluate(()=>{sessionStorage.setItem('lowob-signal-intro','seen')});
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('.lab-signal',{timeout:30000});
            const styles=await page.evaluate(()=>{
              const elements=[...document.querySelectorAll('[data-radar-targets] .lab-signal')];
              const sample=el=>{
                const self=getComputedStyle(el),dot=getComputedStyle(el,'::before'),box=getComputedStyle(el,'::after');
                return {type:el.dataset.type,selected:el.classList.contains('is-selected'),
                  parentColor:self.color,dotColor:dot.color,dotBackground:dot.backgroundColor,
                  dotShadow:dot.boxShadow,boxColor:box.color,boxBorder:box.borderColor,boxShadow:box.boxShadow,
                  boxOpacity:box.opacity};
              };
              const byType={};
              for(const el of elements)if(!byType[el.dataset.type])byType[el.dataset.type]=sample(el);
              const selected=elements.find(el=>el.classList.contains('is-selected'));
              const selectedStyle=selected?sample(selected):null;
              const first=elements[0];if(first)first.classList.add('is-selected');
              const forcedSelected=first?sample(first):null;
              return {total:elements.length,byType,selectedStyle,forcedSelected,canvasCount:document.querySelectorAll('canvas').length};
            });
            console.log('LIVE_RENDERED_RADAR_STYLES='+JSON.stringify(styles));
          } catch(error) {console.log('RADAR_BROWSER_CHECK_FAILED='+error); process.exitCode=1;}
          finally {await browser.close();}
          NODE
