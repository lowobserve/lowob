name: Verify homepage intro replay on refresh
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-home-intro-replay.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the new homepage and animation script are live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            if curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' 'https://lowob.com/?verify=intro-replay-20261123' -o /tmp/live-home.html &&
               curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' 'https://lowob.com/assets/visual-lab.js?v=intro-replay-20261123' -o /tmp/live-intro.js &&
               grep -q 'intro-replay-20261123' /tmp/live-home.html &&
               cmp -s /tmp/live-intro.js dist/assets/visual-lab.js; then
              echo 'LIVE_NEW_INTRO_CODE=yes'
              break
            fi
            if [[ "$attempt" -eq 45 ]]; then
              echo '::error::Live homepage did not serve the new intro code'
              exit 1
            fi
            sleep 4
          done
      - name: Verify animation replays after a full reload even with old session flag
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1
          npx playwright install chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'no-preference'});
          const output={};
          try {
            await page.goto('https://lowob.com/?verify=intro-replay-20261123',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('.lab-blackout:not([hidden])',{timeout:10000});
            output.firstLoadStarted=true;
            await page.waitForFunction(()=>document.querySelector('.lab-blackout')?.hidden===true,{timeout:12000});
            output.firstLoadFinished=true;
            await page.evaluate(()=>sessionStorage.setItem('lowob-signal-intro','seen'));
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('.lab-blackout:not([hidden])',{timeout:10000});
            output.reloadStarted=true;
            await page.waitForFunction(()=>document.querySelector('.lab-blackout')?.hidden===true,{timeout:12000});
            output.reloadFinished=true;
            console.log('INTRO_REPLAY_RESULT='+JSON.stringify(output));
          }catch(e){
            console.log('INTRO_REPLAY_FAILURE='+String(e));
            console.log('INTRO_REPLAY_PARTIAL='+JSON.stringify(output));
            process.exitCode=1;
          }finally{await browser.close()}
          NODE
