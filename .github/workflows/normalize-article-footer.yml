name: Normalize all Research article footer links
on:
  push:
    branches:
      - hotfix/article-footer-canonical-20261112
    paths:
      - scripts/normalize-article-footer.mjs
      - .github/workflows/normalize-article-footer.yml

permissions:
  contents: write

jobs:
  normalize-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and update article footer markup
        run: |
          node --check scripts/normalize-article-footer.mjs
          node scripts/normalize-article-footer.mjs
          node scripts/test-site-meta.mjs
      - name: Ensure changes are restricted to Research article HTML
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(dist/research/[^/]+/index\.html|)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected files: %s\n' "$unexpected"
            exit 1
          fi
          count="$(printf '%s\n' "$changed" | grep -c '^dist/research/[^/][^/]*/index\.html$')"
          if [ "$count" -ne 166 ]; then
            printf 'Expected 166 updated articles, found %s\n' "$count"
            exit 1
          fi
      - name: Commit article HTML to hotfix branch
        run: |
          git config user.name "lowob footer normalization"
          git config user.email "actions@users.noreply.github.com"
          git add dist/research/
          git diff --cached --check
          git commit -m "Normalize footer navigation on all 166 Research articles"
          git push origin HEAD:hotfix/article-footer-canonical-20261112
